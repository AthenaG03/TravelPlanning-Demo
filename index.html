<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旅行规划 · 开始你的下一段旅程</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh;
    background:linear-gradient(160deg,#0ea5e9 0%,#06b6d4 40%,#10b981 100%);
    color:#1e293b;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    overflow-x:hidden;
  }
  .hero{
    text-align:center;
    max-width:640px;
    margin-bottom:48px;
    animation:fadeUp .8s ease-out;
  }
  .hero .emoji{font-size:56px;margin-bottom:16px;display:block}
  .hero h1{
    font-size:clamp(28px,5vw,42px);
    font-weight:800;
    color:#fff;
    letter-spacing:1px;
    margin-bottom:14px;
    text-shadow:0 2px 12px rgba(0,0,0,.15);
  }
  .hero p{
    font-size:clamp(14px,2.5vw,17px);
    color:rgba(255,255,255,.9);
    line-height:1.7;
    max-width:480px;
    margin:0 auto;
  }
  .start-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-top:36px;
    padding:18px 44px;
    font-size:18px;
    font-weight:700;
    color:#0e7490;
    background:#fff;
    border:none;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 8px 30px rgba(0,0,0,.18);
    transition:transform .2s,box-shadow .2s;
    text-decoration:none;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(0,0,0,.25)}
  .start-btn:active{transform:translateY(0)}
  .start-btn .arrow{font-size:20px;transition:transform .2s}
  .start-btn:hover .arrow{transform:translateX(4px)}
  .features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    max-width:720px;
    width:100%;
    animation:fadeUp 1s ease-out;
  }
  .feature{
    background:rgba(255,255,255,.95);
    border-radius:16px;
    padding:24px 20px;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,.1);
    backdrop-filter:blur(10px);
  }
  .feature .icon{font-size:32px;margin-bottom:10px;display:block}
  .feature h3{font-size:15px;font-weight:700;color:#0f172a;margin-bottom:6px}
  .feature p{font-size:12px;color:#64748b;line-height:1.6}
  .footer{
    margin-top:40px;
    font-size:12px;
    color:rgba(255,255,255,.6);
    text-align:center;
  }
  .plans{
    max-width:720px;
    width:100%;
    margin-top:44px;
    animation:fadeUp .9s ease-out;
  }
  .plans-head{
    font-size:18px;
    font-weight:800;
    color:#fff;
    margin-bottom:14px;
    text-shadow:0 1px 8px rgba(0,0,0,.15);
  }
  .plans-list{display:flex;flex-direction:column;gap:12px}
  .plan-card{
    background:rgba(255,255,255,.96);
    border-radius:14px;
    padding:16px 18px;
    box-shadow:0 4px 20px rgba(0,0,0,.12);
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:transform .15s,box-shadow .15s;
    text-decoration:none;
    color:#1e293b;
  }
  .plan-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.18)}
  .plan-card .p-icon{
    width:46px;height:46px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,#36c7a0,#55a5ff);
    color:#fff;font-weight:800;font-size:20px;
    display:flex;align-items:center;justify-content:center;
  }
  .plan-card .p-main{flex:1;min-width:0}
  .plan-card .p-title{font-size:15px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plan-card .p-meta{font-size:12px;color:#64748b;line-height:1.5}
  .plan-card .p-go{font-size:13px;color:#0e7490;font-weight:600;flex-shrink:0;display:flex;align-items:center;gap:3px}
  .plan-card .p-del{
    flex-shrink:0;border:none;background:none;color:#94a3b8;font-size:16px;cursor:pointer;padding:6px 4px;border-radius:6px;
  }
  .plan-card .p-del:hover{color:#e5484d;background:#fdecea}
  .plans-empty{
    background:rgba(255,255,255,.9);
    border-radius:14px;
    padding:26px 20px;
    text-align:center;
    font-size:13px;
    color:#64748b;
    line-height:1.7;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(24px)}
    to{opacity:1;transform:translateY(0)}
  }
  @media(max-width:600px){
    body{padding:32px 16px;justify-content:flex-start;padding-top:60px}
    .hero{margin-bottom:32px}
    .hero .emoji{font-size:44px}
    .start-btn{padding:16px 36px;font-size:16px;margin-top:28px}
    .features{grid-template-columns:1fr;gap:12px;max-width:400px}
    .feature{padding:18px 16px;display:flex;align-items:center;gap:14px;text-align:left}
    .feature .icon{font-size:28px;margin-bottom:0;flex-shrink:0}
    .feature h3{font-size:14px;margin-bottom:2px}
    .feature p{font-size:11px}
  }
</style>
</head>
<body>
  <div class="hero">
    <span class="emoji">🧭</span>
    <h1>旅行规划</h1>
    <p>输入你想去的地方，自动规划最优路线，<br>不走回头路，每一天都值得期待。</p>
    <a href="chuanxi_travel_amap_mvp_v2.html?new=1" class="start-btn">
      开始一段新的旅程 <span class="arrow">→</span>
    </a>
  </div>

  <div class="features">
    <div class="feature">
      <span class="icon">📍</span>
      <div>
        <h3>自由添加景点</h3>
        <p>输入任意城市或景点，自动定位坐标</p>
      </div>
    </div>
    <div class="feature">
      <span class="icon">🛣️</span>
      <div>
        <h3>智能路线优化</h3>
        <p>动态规划算最短路径，天然避免回头路</p>
      </div>
    </div>
    <div class="feature">
      <span class="icon">📅</span>
      <div>
        <h3>每日行程细化</h3>
        <p>按天安排交通、景点、餐饮、住宿</p>
      </div>
    </div>
  </div>

  <div class="plans" id="plansBox" style="display:none">
    <div class="plans-head">🗂️ 我的规划</div>
    <div class="plans-list" id="plansList"></div>
  </div>
  <div class="plans" id="plansEmpty" style="display:none">
    <div class="plans-head">🗂️ 我的规划</div>
    <div class="plans-empty">还没有保存的规划，开始一段旅程后点「💾 保存」即可在这里继续编辑或回忆</div>
  </div>

  <div class="footer">Travel Planning Demo · 基于高德地图</div>

<script>
(function(){
  const KEY='travel_plans';
  let plans=[];
  try{ plans=JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ plans=[]; }
  const box=document.getElementById('plansBox');
  const empty=document.getElementById('plansEmpty');
  const list=document.getElementById('plansList');
  const short=s=>s.replace('（出发地）','').replace('（返回）','');
  function render(){
    if(!plans.length){ box.style.display='none'; empty.style.display=''; return; }
    box.style.display=''; empty.style.display='none';
    list.innerHTML=plans.map(p=>{
      const n=p.cities?p.cities.length:0;
      const route=(p.cities||[]).slice(0,3).map(c=>short(c.name||'')).join(' → ')+(n>3?` 等${n}个地点`:'');
      return `<a class="plan-card" href="chuanxi_travel_amap_mvp_v2.html?load=${encodeURIComponent(p.id)}">
        <div class="p-icon">${(p.title||'旅').trim().charAt(0)}</div>
        <div class="p-main">
          <div class="p-title">${(p.title||'未命名规划')}</div>
          <div class="p-meta">${p.dates||''} · ${n}天${Math.max(0,n-1)}晚<br>${route} · 保存于 ${p.savedAt||''}</div>
        </div>
        <span class="p-go">继续编辑 →</span>
        <button class="p-del" title="删除该规划">✕</button>
      </a>`;
    }).join('');
    list.querySelectorAll('.plan-card').forEach(card=>{
      card.addEventListener('click',e=>{
        if(e.target.closest('.p-del')){
          e.preventDefault(); e.stopPropagation();
          const id=new URLSearchParams(new URL(card.href).search).get('load');
          const title=card.querySelector('.p-title').textContent;
          if(confirm('删除规划「'+title+'」？此操作不可恢复。')){
            plans=plans.filter(p=>p.id!==id);
            try{ localStorage.setItem(KEY,JSON.stringify(plans)); }catch(e2){}
            render();
          }
        }
      });
    });
  }
  render();
})();
</script>
</body>
</html>
